# CI: тесты DAG-ов и линтеры.
# Деплой отдельного workflow не требует: git-sync на сервере подтягивает ветку main,
# поэтому в main должен попадать только код с зелёным CI (защита ветки).

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AIRFLOW_VERSION: "2.10.2"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow-ci
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt \
            -c "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"

      - name: Pytest
        run: python -m pytest -q

      # Пока код не вычищен под ruff и black, их ошибки не блокируют merge.
      - name: Ruff
        continue-on-error: true
        run: python -m ruff check dags/ tests/

      - name: Black
        continue-on-error: true
        run: python -m black --check dags/ tests/
